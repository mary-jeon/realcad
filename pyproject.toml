[project]
name = "realcad"
version = "0.2.0"
description = "Prompt to CAD parts that really fit: Meta Muse Spark designs, the CAD engine checks bolts, clearances and edge distances, and exports STEP and STL."
requires-python = ">=3.12"
dependencies = [
  "build123d>=0.13", "trimesh>=5.2",
  "fastapi", "uvicorn", "python-multipart",
  "shapely>=2.0", "rtree>=1.0", "manifold3d>=3.0",
  "networkx", "lxml",
]
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realcad"]
