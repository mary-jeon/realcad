<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RealCAD Viewer</title>
<style>
  html,body{margin:0;height:100%;background:#eef1f4;font-family:system-ui,sans-serif;overflow:hidden}
  #c{display:block}
  #tag{position:fixed;top:12px;left:16px;color:#2b3a46;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="tag">RealCAD — solid preview</div>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 5000);
camera.position.set(45, -70, 150);
camera.up.set(0,0,1);
const controls = new THREE.OrbitControls(camera, canvas);

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5560, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(80,-120,160); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-100,60,40); scene.add(fill);

const grid = new THREE.GridHelper(200, 20, 0xc3ccd4, 0xd6dde3);
grid.rotation.x = Math.PI/2; grid.position.z = -20; scene.add(grid);

const loader = new THREE.STLLoader();
let pending = 2;
function add(url, color, metal){
  loader.load(url, g => {
    g.computeVertexNormals();
    const m = new THREE.MeshStandardMaterial({color, metalness:metal, roughness:0.55, flatShading:false});
    scene.add(new THREE.Mesh(g, m));
    if(--pending===0) frame();
  });
}
add('part.stl', 0x9aa7b2, 0.1);
add('bolts.stl', 0xd1495b, 0.4);

function frame(){
  const box = new THREE.Box3().setFromObject(scene);
  const c = box.getCenter(new THREE.Vector3());
  controls.target.copy(c);
  controls.update();
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
